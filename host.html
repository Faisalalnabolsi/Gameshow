<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeopardy Host</title><link rel="stylesheet" href="style.css"></head><body>
<main class="wrap">
<h1>Game Show · Host Panel</h1>
<section id="login" class="card center" hidden style="max-width:420px;margin:auto"><h2>Host login</h2>
 <div class="row"><input id="em" type="email" placeholder="Email"></div><div class="row"><input id="pw" type="password" placeholder="Password"></div>
 <button id="signin">Sign in</button><p id="lerr" class="small"></p></section>
<div id="app" hidden>
<section class="grid">
 <div class="card center"><h2>Players scan to join</h2><div id="qr"></div><p id="link" class="small"></p><p class="small"><a id="disp" target="_blank">Open the big-screen display ↗</a></p></div>
 <div class="card"><h2>Current clue</h2>
  <div id="clue" class="clue"></div><div id="pv" class="items"></div>
  <div id="ans" class="small"></div>
  <div id="status" class="status">Locked</div>
  <div class="row"><button id="open">Open buzzers</button><button id="ok" class="good">Correct +</button><button id="bad" class="bad">Wrong −</button><button id="next">Next clue ▸</button><button id="replay" class="bad">🔊 Replay</button><button id="skip">Skip</button><button id="cancel" class="bad">Cancel</button></div>
  <label class="small">Points (fills in from the clue, editable) <input id="val" type="number" value="200" step="100" style="width:100px"></label>
  <label class="small"><input id="auto" type="checkbox" checked> Open buzzers automatically when a clue is picked</label>
 </div>
</section>
<div class="layout">
<section class="card"><h2>Board</h2><div class="row"><select id="boards"></select><button id="load">Load board</button><a href="editor.html">Edit boards</a></div><div id="board" class="board"></div></section>
<section class="card"><h2>Players</h2>
 <div class="row"><input id="name" placeholder="Player name"><button id="add">Add player</button><button id="reset" class="bad">New game</button></div>
 <div id="players"></div>
</section>
</div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
import { db, get, ref, set, push, remove, onValue, runTransaction, room, esc, norm, arr, worth, auth, onAuthStateChanged, signInWithEmailAndPassword } from "./common.js";
const $ = id => document.getElementById(id);
const R = p => ref(db, `rooms/${room}/${p}`);
let players = {}, buzz = {}, clue = null, used = {}, board = { categories: [] }, showAns = false, lib = {}, boardId = null, pvSig = "";

const joinUrl = new URL("play.html?room=" + room, location.href).href;
try { const q = qrcode(0, "M"); q.addData(joinUrl); q.make(); $("qr").innerHTML = q.createImgTag(6, 0); }
catch (e) { $("qr").textContent = "QR failed: " + e.message; }
$("link").textContent = joinUrl;
$("disp").href = new URL("index.html?room=" + room, location.href).href;

const useBoard = () => { board = lib[boardId] ? norm(lib[boardId]) : { categories: [] }; render(); };
const fillBoards = () => { $("boards").innerHTML = Object.entries(lib).map(([k, b]) => `<option value="${k}" ${k === boardId ? "selected" : ""}>${esc(b.name || "Untitled")}${b.type === "tier" ? " (tier)" : ""}</option>`).join(""); };
onValue(R("boardId"), s => { boardId = s.val(); fillBoards(); useBoard(); });
onAuthStateChanged(auth, u => {
  $("login").hidden = !!u; $("app").hidden = !u;
  if (u) onValue(ref(db, "library/boards"), s => { lib = s.val() || {}; fillBoards(); useBoard(); });
});
$("signin").onclick = () => signInWithEmailAndPassword(auth, $("em").value, $("pw").value).catch(e => $("lerr").textContent = "Sign-in failed: " + e.code);
$("load").onclick = async () => {
  const id = $("boards").value; if (!id) return;
  if (Object.keys(used).length && !confirm("Loading a board resets the tiles. Continue?")) return;
  const b = norm(lib[id]);
  await set(R("board"), { name: b.name, type: b.type || "jeopardy", decay: b.decay ?? 10, categories: b.categories.map(c => ({ name: c.name, clues: c.clues.map(q => ({ value: q.value ?? c.points ?? 0, question: q.question ?? "" })) })) });
  set(R("boardId"), id); set(R("used"), null); set(R("clue"), null); set(R("buzz"), { open: false });
};
onValue(R("players"), s => { players = s.val() || {}; render(); });
onValue(R("buzz"), s => { buzz = s.val() || {}; render(); });
let lastWk = "";
onValue(R("clue"), s => {
  clue = s.val(); showAns = false;
  const wk = clue ? clue.key + "|" + (clue.shown ?? 0) : "";
  if (wk !== lastWk) { lastWk = wk; if (clue) $("val").value = worth(clue, board.decay); }
  render();
});
onValue(R("used"), s => { used = s.val() || {}; render(); });

const curClue = () => { if (!clue) return null; const [i, r] = clue.key.split("-"); return board.categories[i]?.clues[r]; };

function render() {
  const w = buzz.winner && players[buzz.winner];
  $("status").textContent = w ? `${w.name} buzzed first!` : buzz.open ? "Buzzers open…" : "Locked";
  const tier = clue && clue.type === "tier";
  $("clue").textContent = !clue ? "Pick a tile on the board" : tier
    ? `${clue.cat} · worth ${worth(clue, board.decay)} · clue ${clue.shown}/${clue.total}\n` + arr(clue.items).filter(i => i.type === "text").map(i => i.v).join("\n")
    : `${clue.cat} · ${clue.value}\n${clue.question}`;
  $("next").hidden = !tier || !!clue.all; $("replay").hidden = !tier;
  const psig = tier ? clue.key + "|" + arr(clue.items).length : "";
  if (psig !== pvSig) { pvSig = psig; $("pv").innerHTML = tier ? arr(clue.items).map(i => i.v.startsWith("db:") ? `<div class="small">📎 uploaded ${i.type}</div>` : i.type === "image" ? `<img src="${esc(i.v)}" referrerpolicy="no-referrer" style="max-height:90px;border-radius:10px" alt="image failed to load">` : i.type === "audio" ? `<audio src="${esc(i.v)}" controls style="height:32px"></audio>` : "").join("") : ""; }
  $("ans").textContent = clue ? (showAns ? "Answer: " + (curClue()?.answer || "?") : "👁 Tap to show answer") : "";

  const cats = board.categories, rows = Math.max(0, ...cats.map(c => c.clues.length));
  let h = cats.map(c => `<div class="cat">${esc(c.name)}</div>`).join("");
  for (let r = 0; r < rows; r++) cats.forEach((c, i) => {
    const q = c.clues[r], k = i + "-" + r;
    h += q ? `<button class="tile" data-k="${k}" ${used[k] || clue ? "disabled" : ""}>${used[k] ? "" : (q.value ?? c.points)}</button>` : "<div></div>";
  });
  $("board").style.gridTemplateColumns = `repeat(${cats.length || 1},1fr)`;
  $("board").innerHTML = h;

  $("players").innerHTML = Object.entries(players).sort((a, b) => a[1].num - b[1].num).map(([id, p]) =>
    `<div class="p ${id === buzz.winner ? "win" : ""}"><b>#${p.num}</b><span class="n">${esc(p.name)}</span><span class="s">${p.score}</span>
     <button data-a="-" data-id="${id}">−</button><button data-a="+" data-id="${id}">+</button><button data-a="x" data-id="${id}" class="bad">✕</button></div>`).join("");
}

const val = () => Number($("val").value) || 0;
const pts = () => val();
$("auto").checked = localStorage.getItem("auto") !== "0";
$("auto").onchange = () => localStorage.setItem("auto", $("auto").checked ? "1" : "0");
const adjust = (id, d) => runTransaction(R(`players/${id}/score`), v => (v || 0) + d);
const pub = async its => { for (const i of its) if (i.type !== "text" && i.v?.startsWith("db:")) { const k = i.v.slice(3), d = (await get(ref(db, "library/media/" + k))).val()?.data; if (d) await set(R("media/" + k), d); } };
const done = mark => { if (clue && mark) set(R("used/" + clue.key), true); set(R("clue"), null); set(R("media"), null); set(R("buzz"), { open: false }); };

$("board").onclick = async e => {
  const k = e.target.dataset.k; if (!k || clue) return;
  const [i, r] = k.split("-"), c = board.categories[i], q = c.clues[r];
  set(R("buzz"), { open: false });
  if ($("auto").checked) setTimeout(() => { if (clue && clue.key === k && !buzz.winner) set(R("buzz"), { open: true }); }, 3300);
  if (board.type === "tier") { const it = arr(q.items).filter(x => x.v?.trim()); const n = board.allAtOnce ? it.length : Math.min(1, it.length); await pub(it.slice(0, n)); set(R("clue"), { key: k, cat: c.name, value: c.points, type: "tier", all: !!board.allAtOnce, shown: n, total: it.length, items: it.slice(0, n) }); }
  else set(R("clue"), { key: k, cat: c.name, value: q.value, question: q.question });
};
$("ans").onclick = () => { showAns = !showAns; render(); };

$("add").onclick = () => {
  const name = $("name").value.trim(); if (!name) return;
  const num = Math.max(0, ...Object.values(players).map(p => p.num)) + 1;
  push(R("players"), { name, num, score: 0 }); $("name").value = "";
};
$("name").onkeydown = e => { if (e.key === "Enter") $("add").click(); };
$("players").onclick = e => {
  const { a, id } = e.target.dataset; if (!a) return;
  if (a === "x") { if (confirm(`Remove ${players[id].name}?`)) remove(R("players/" + id)); }
  else adjust(id, a === "+" ? val() : -val());
};
$("reset").onclick = () => {
  if (!confirm("Reset all scores and the board?")) return;
  set(R("used"), null); set(R("clue"), null); set(R("buzz"), { open: false });
  Object.keys(players).forEach(id => set(R(`players/${id}/score`), 0));
};

$("open").onclick = () => set(R("buzz"), { open: true });
$("next").onclick = async () => { const all = arr(curClue()?.items).filter(i => i.v?.trim()); if (clue && clue.shown < all.length) { await pub([all[clue.shown]]); set(R("clue"), { ...clue, shown: clue.shown + 1, items: all.slice(0, clue.shown + 1) }); } };
$("replay").onclick = () => clue && set(R("clue/play"), Date.now());
$("skip").onclick = () => done(true);
$("cancel").onclick = () => done(false);
const result = (ok, d) => {
  const w = buzz.winner, p = players[w];
  set(R("result"), { t: Date.now(), ok, name: p?.name || "", id: w, from: p?.score || 0, to: (p?.score || 0) + d,
    rows: Object.entries(players).map(([id, q]) => ({ id, num: q.num, name: q.name, from: q.score, to: q.score + (id === w ? d : 0) })) });
};
$("ok").onclick = () => { if (buzz.winner) { const d = pts(); result(true, d); adjust(buzz.winner, d); done(true); } };
$("bad").onclick = () => {
  if (!buzz.winner) return;
  const d = pts(); result(false, -d); adjust(buzz.winner, -d);
  set(R("buzz"), { open: true, out: { ...(buzz.out || {}), [buzz.winner]: true } });
};
</script></body></html>
